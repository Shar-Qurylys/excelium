<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Doc-V Gateway</title>
<style>{{ ds_css }}
body { display:flex; min-height:100vh; align-items:center; justify-content:center; }
.login { width:380px; }
.login .card-body { padding:28px 32px 32px; }
.brandline { display:flex; align-items:center; gap:.4em; font:700 18px/1 var(--font-sans);
             color:var(--brand-ink); margin-bottom:6px; }
.login h1 { font:600 20px/1 var(--font-sans); color:var(--text-strong); margin:14px 0 4px; }
.login p { font:400 13px/1.4 var(--font-sans); color:var(--text-muted); margin:0 0 18px; }
.login .btn { width:100%; height:42px; margin-top:14px; }
.err-line { margin-top:12px; font:500 13px/1.4 var(--font-sans); color:var(--chip-danger-ink); }
</style>
</head>
<body>
<form class="card login" method="post" action="/ui/login">
  <div class="card-body">
    <div class="brandline"><span aria-hidden="true">◢</span>DOC-V GATEWAY</div>
    <h1>Вход в панель</h1>
    <p>Доступ по админ-токену из <span class="mono">.env</span> сервиса.</p>
    <input type="password" name="token" placeholder="Админ-токен" autofocus>
    <button class="btn">Войти</button>
    {% if error %}<div class="err-line">{{ error }}</div>{% endif %}
  </div>
</form>
</body>
</html>
