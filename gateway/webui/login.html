<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Вход — Doc-V Gateway</title>
<style>
body { margin:0; font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:#1c2430; display:flex; min-height:100vh; align-items:center;
       justify-content:center; }
.box { background:#fff; border-radius:10px; padding:32px 36px; width:340px; }
h1 { font-size:18px; margin:0 0 16px; }
input { width:100%; padding:9px 12px; border:1px solid #dde1e6; border-radius:6px;
        font:inherit; box-sizing:border-box; }
button { width:100%; margin-top:14px; background:#1f6feb; color:#fff; border:0;
         padding:10px; border-radius:6px; font:inherit; cursor:pointer; }
.err { color:#b42318; font-size:14px; margin-top:10px; }
</style></head>
<body>
<form class="box" method="post" action="/ui/login">
  <h1>Doc-V Gateway</h1>
  <input type="password" name="token" placeholder="Админ-токен" autofocus>
  <button>Войти</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
